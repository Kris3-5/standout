<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ff00b1'/></svg>">
  <title>Event · StandOut</title>
</head>
<body>
  <header id="site-header"></header>

  <main id="event"></main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script>
    renderHeader("public", "discover");
    renderFooter();

    const e = EVENTS.find(x => x.id === qs("id")) || EVENTS[0];
    document.title = `${e.name} · StandOut`;

    const total = e.bookable ? ZONES.reduce((n, z) => n + z.stands.length, 0) : e.stands.total;
    const booked = e.bookable ? ZONES.reduce((n, z) => n + z.booked.length, 0) : e.stands.total - e.stands.left;
    const from = e.bookable ? Math.min(...ZONES.map(z => z.price)) : e.stands.from;
    const chipColours = ["chip--teal", "chip--pink", "chip--violet", "chip--yellow"];
    const art = blobArt(e.colour === "pink" ? "pink" : e.colour);
    const heroBg = { pink: "var(--pink)", teal: "var(--teal)", yellow: "var(--yellow)", violet: "var(--violet)" }[e.colour];
    const bookUrl = (zone) => e.bookable ? `book.html${zone ? "?zone=" + zone : ""}` : "#packages";

    document.getElementById("event").innerHTML = `
      <section class="event-hero" style="background:${heroBg}">
        <div class="wrap">
          <div>
            <ul class="chips">${e.tags.map(t => `<li class="chip">${t}</li>`).join("")}</ul>
            <h1>${e.name}</h1>
            <p class="event-hero__where">${e.venue}<br>${e.when}</p>
            <p class="event-hero__intro">${e.intro}</p>
            <div class="event-hero__ctas">
              <a class="btn btn--ink" href="${bookUrl()}">Book a stand</a>
              <a class="btn btn--white" href="#" onclick="toast('Ticketing links to the organiser\\'s own ticket site');return false;">Get tickets</a>
            </div>
          </div>
          <div class="event-art" style="background:${art.bg}" role="img" aria-label="Event photo placeholder">
            <span class="event-art__tag">[Event photo]</span>${art.html}
          </div>
        </div>
      </section>

      <section style="padding-block:28px 10px">
        <div class="wrap stats">
          <div class="stat bg-teal"><p class="stat__label">Stands available</p><p class="stat__value">${total - booked} of ${total}</p></div>
          <div class="stat bg-violet"><p class="stat__label">Stands from</p><p class="stat__value">${money(from)}</p></div>
          <div class="stat bg-yellow"><p class="stat__label">Expected visitors</p><p class="stat__value">${e.visitors}</p></div>
          <div class="stat bg-pink"><p class="stat__label">Exhibitor deadline</p><p class="stat__value">${e.deadline}</p></div>
        </div>
      </section>

      <section>
        <div class="wrap about-grid">
          <div>
            <h2>About the ${e.type.toLowerCase()}</h2>
            ${e.about.map(p => `<p>${p}</p>`).join("")}
          </div>
          <div>
            <h2>Who exhibits here</h2>
            <ul class="chips">${e.exhibitors.map((x, i) => `<li class="chip ${chipColours[i % 4]}">${x}</li>`).join("")}</ul>
          </div>
        </div>
      </section>

      <section id="packages" style="padding-top:0">
        <div class="wrap">
          <div class="section-head">
            <h2>Exhibitor packages</h2>
            <p class="small">Example pricing for the preview. Organisers set their own.</p>
          </div>
          <div class="packages">
            ${PACKAGES.map(p => `
              <article class="package ${p.style}">
                <p class="package__name">${p.name.toUpperCase()}</p>
                <p class="package__price">${money(p.price)}</p>
                <p class="package__desc">${p.desc}</p>
                <a class="btn ${p.btn} btn--block" href="${bookUrl(p.zone)}">${p.cta}</a>
              </article>`).join("")}
          </div>
        </div>
      </section>

      <section style="padding-top:0">
        <div class="wrap">
          <div class="why">
            <h2>Why book through StandOut</h2>
            <div><h3>See your exact spot</h3><p>Pick from a live floor plan, no back-and-forth emails.</p></div>
            <div><h3>Pay securely, get confirmed</h3><p>Card or invoice, with instant booking confirmation.</p></div>
            <div><h3>Get found by visitors</h3><p>Optional boosts put your stand in front of the right crowd.</p></div>
          </div>
        </div>
      </section>`;
  </script>
</body>
</html>
