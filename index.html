<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ff00b1'/></svg>">
  <title>StandOut · Discover events and book your stand</title>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="discover-hero">
      <div class="wrap">
        <h1>Find your crowd. Book your stand.</h1>
        <p>Browse festivals, markets and shows across the UK, see the floor plan, and book the exact spot you want in a few minutes.</p>
        <form class="search-row" role="search" onsubmit="event.preventDefault()">
          <label for="q" class="sr-only">Search events</label>
          <input id="q" type="search" placeholder="Search by event, city or category" autocomplete="off">
          <button class="btn btn--ink" type="submit">Search</button>
        </form>
      </div>
    </section>

    <section>
      <div class="wrap">
        <div class="section-head">
          <h2>Events taking exhibitors</h2>
        </div>
        <div class="filter-row" id="filters">
          <strong>Show:</strong>
        </div>
        <div class="event-grid" id="event-grid"></div>
        <p class="muted" id="no-results" hidden>No events match that search. Try a city or a category like "Food".</p>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script>
    renderHeader("public", "discover");
    renderFooter();

    const grid = document.getElementById("event-grid");
    const filters = document.getElementById("filters");
    const q = document.getElementById("q");
    const types = ["All", ...new Set(EVENTS.map(e => e.type))];
    let activeType = "All";

    types.forEach(t => {
      const b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.textContent = t;
      b.setAttribute("aria-pressed", t === activeType);
      b.onclick = () => {
        activeType = t;
        filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
        draw();
      };
      filters.appendChild(b);
    });

    function standsInfo(e) {
      if (e.bookable) {
        const total = ZONES.reduce((n, z) => n + z.stands.length, 0);
        const booked = ZONES.reduce((n, z) => n + z.booked.length, 0);
        const from = Math.min(...ZONES.map(z => z.price));
        return { left: total - booked, total, from };
      }
      return e.stands;
    }

    function draw() {
      const term = q.value.trim().toLowerCase();
      const list = EVENTS.filter(e =>
        (activeType === "All" || e.type === activeType) &&
        (!term || [e.name, e.venue, e.city, ...e.tags, ...e.exhibitors].join(" ").toLowerCase().includes(term))
      );
      grid.innerHTML = list.map(e => {
        const s = standsInfo(e);
        const art = blobArt(e.colour);
        return `
          <a class="event-card" href="event.html?id=${e.id}">
            <div class="event-card__art" style="background:${art.bg}">${art.html}</div>
            <div class="event-card__body">
              <h3>${e.name}</h3>
              <p class="event-card__meta">${e.venue}</p>
              <p class="event-card__meta muted">${e.when}</p>
              <div class="event-card__foot">
                <span class="badge-left">${s.left} of ${s.total} stands left</span>
                <span>From ${money(s.from)}</span>
              </div>
            </div>
          </a>`;
      }).join("");
      document.getElementById("no-results").hidden = list.length > 0;
    }

    q.addEventListener("input", draw);
    draw();
  </script>
</body>
</html>
